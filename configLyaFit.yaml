# =====================================================
# Instrumental Settings
# =====================================================

# Instruments: MUSE, KCWI, XSHOOTER, MAGE, LLAMAS, None
Instrument: "MUSE"

# If Instrument is set to "None", custom settings must be provided:
LSF_FWHM: 0.136 # @ Peak wavelength of Lyα line
PixelScale: 0.04 # Wavelength spacing per pixel

SNR: 10000.  # Signal-to-noise ratio for model spectrum (preferably do not change)

# =====================================================
# Units Settings
# =====================================================

WavelengthUnits: "Angstrom"   # Options: "Angstrom" (DO NOT CHANGE and make sure your data is in Angstroms)
FluxUnits: "1e-18 erg s$^{-1}$ cm$^{-2}$ Angstrom$^{-1}$" # "1e-20 erg s$^{-1}$ cm$^{-2}$ Angstrom$^{-1}$" for MUSE data


# =====================================================
# MCMC Settings
# =====================================================
MCMCA: 1.5            # Stretch move parameter (adjust if acceptance fraction (af) is outside [0.2, 0.5])
                      # If af < 0.2 decrease the a parameter
                      # If af > 0.5 increase the a parameter

Nthreads: 8           # Number of parallel threads
nwalkers: 100          # Number of walkers (should be >= 2 * number of free parameters)
nsteps: 1000            # Number of steps per walker
MOVES: Stretch        # Move strategy: 'Stretch' or 'KDE'

